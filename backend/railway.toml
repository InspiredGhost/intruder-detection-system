[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-web.txt && cd ../frontend && npm ci && npm run build && cd ../backend && mkdir -p static && cp -r ../frontend/dist/. static/"

[deploy]
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
